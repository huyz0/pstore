# ⚠️ Run the WHOLE workspace's tests against every mutant, not just the mutated
# package's own.
#
# The default is per-package, and it silently understates the score in a workspace laid
# out like this one: `pstore-blob` defines the store decorators, but the conformance suite
# that interrogates them lives in `pstore-testkit`, so by default a mutant in a decorator
# was never shown the one test that catches it. It was reported MISSED while a test that
# fails on it sat two directories away.
#
# Costs wall-clock. Buys a score that means what it says.
test_workspace = true

# ⚠️ Debug symbols off. `cargo-mutants` rebuilds and relinks once per mutant, so link time
# is multiplied by the mutant count -- 462 of them in M5. A mutation run never opens a
# debugger, and the smaller `target/` is what lets the per-job copies fit a ramdisk: eight
# copies of a 29 GB target filled a 23 GB tmpfs mid-sweep and it died with ENOSPC.
# The profile itself is in the workspace root, which is where cargo profiles live.
profile = "mutants"

# ⚠️ No doctests. Every doctest example becomes its own test binary, which is among the
# slowest things `cargo test` does. This workspace has none today; stated explicitly so
# adding one does not silently multiply every sweep.
additional_cargo_test_args = ["--all-targets"]

# ⚠️ **Feature-gated code must be built, or its mutants are false negatives.**
# `pstore-blob`'s `object_store` adapter is behind a feature, and without this a sweep
# reports every mutant in it as MISSED -- for the uninteresting reason that nothing compiled
# it, which reads in the output exactly like a weak test. Found in M7a, where two such
# "survivors" turned out to be code the sweep had never run.
#
# `object_store` and not `compat`: `compat` pulls the aws, gcp and azure clients into every
# one of the N per-mutant builds, and those add nothing a mutant of ours can be caught by.
additional_cargo_args = ["--features", "pstore-blob/object_store"]

# ⚠️ **Equivalent mutants, excluded by name -- each with its reason, and each premise tested.**
# D-111's exclusion policy (engineering-standards.md): an exclusion says why and is reviewed
# like code. A regex keys on the mutant's NAME, so where a premise can be tested it is: if the
# code stops being equivalent, that test fails rather than this line silently hiding a mutant
# a test could kill. Where it cannot (M8h's), the entry says so and names line and column.
exclude_re = [
    # `Faults::none()` IS `Self::default()`, so replacing its body with `Default::default()`
    # changes nothing. Premise: `faulty::tests::no_faults_is_exactly_the_default`. (M8c)
    'replace Faults::none -> Self with Default::default\(\)',
    # ⚠️ NOT a proven equivalence, and no test backs it -- the one exclusion here without a
    # premise test. `place`'s ring search (`*p < pos`) differs from `<=` only when a key's 64-bit
    # hash EQUALS a node's ring position. FNV-1a does collide between ordinary UTF-8 strings, so
    # such a key exists, but finding one is a ~2^32 birthday search, and what the test would pin
    # -- which node a key sitting exactly on a ring position starts its window at -- is a
    # tie-break no real key reaches. Named by LINE AND COLUMN on purpose: an edit that moves it
    # makes it reappear as MISSED, rather than silently hiding a new `<`-to-`<=` in `place`. (M8h)
    'pstore-cluster/src/placement\.rs:77:54: replace < with <= in Placement',
]
