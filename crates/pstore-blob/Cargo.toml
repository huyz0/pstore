[package]
name        = "pstore-blob"
version     = "0.1.0"
description = "The only way pstore touches durable storage: BlobStore trait, backends, accounting, coalescing."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-types = { path = "../pstore-types" }
async-trait  = "0.1"
bytes        = "1"
thiserror    = "2"
tokio        = { version = "1", features = ["sync", "time", "rt"] }
object_store = { version = "0.14.1", default-features = false, optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
# M107: the request type of GCS's batch delete, which `object_store` takes but does not
# re-export. Already in the lockfile, at the version `object_store` uses.
http         = { version = "1", optional = true }
# M286: pstore's own S3 client. Every crate here was already in the lockfile.
hyper          = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util     = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"], optional = true }
hyper-rustls   = { version = "0.27", default-features = false, features = ["http1", "tls12", "native-tokio", "aws-lc-rs"], optional = true }
http-body-util = { version = "0.1", optional = true }
ring           = { version = "0.17", optional = true }
md-5           = { version = "0.11", optional = true }
base64         = { version = "0.22", optional = true }

[dev-dependencies]
# M286: `s3` for the fake S3 both clients are tested against.
pstore-testkit = { path = "../pstore-testkit", features = ["s3"] }
# The M85 measurement example clusters real vectors; a dev-dependency cycle cargo allows.
pstore-index = { path = "../pstore-index" }
pstore-format = { path = "../pstore-format" }
pstore-types = { path = "../pstore-types" }
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
async-trait = "0.1"
# `aws` (M286): `object_store`'s S3 client on the fake, beside pstore's own.
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
hyper = { version = "1", default-features = false }
# M286's bench counts the clients' allocations.
stats_alloc = "0.1.10"
# M107: the emulator test seeds objects with a request `object_store` cannot send there.
http = "1"

[features]
object_store = ["dep:object_store"]
# M286: `S3Backend`, pstore's own S3 client, which needs neither `object_store` nor what it
# brings (chrono, humantime, reqwest, quinn).
s3-native = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:http", "dep:http-body-util", "dep:ring", "dep:md-5", "dep:base64"]
# M107: GCS's batch delete, one request for up to 100 objects. Not in `pstore-server`'s
# features: GCS is not a server backend (the capability matrix), only a probe target.
gcs = ["object_store", "object_store/gcp", "dep:http"]
# ⚠️ The emulator-integration feature `dev/README.md` has always named and nothing has ever
# provided. It pulls the three cloud clients in; `scripts/conformance.sh` is what runs them.
compat = [
    "object_store",
    "object_store/aws",
    "gcs",
    "object_store/azure",
]

[[example]]
name = "probe"
required-features = ["compat"]

[[example]]
name = "s3_clients"
required-features = ["object_store", "s3-native"]

[[example]]
name = "coalesce_s3"
required-features = ["compat"]
