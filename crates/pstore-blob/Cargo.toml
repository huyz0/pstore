[package]
name        = "pstore-blob"
version     = "0.1.0"
description = "The only way pstore touches durable storage: BlobStore trait, backends, accounting, coalescing."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-types = { path = "../pstore-types" }
async-trait  = "0.1"
bytes        = "1"
thiserror    = "2"
tokio        = { version = "1", features = ["sync", "time", "rt"] }
object_store = { version = "0.14.1", default-features = false, optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
# M107: the request type of GCS's batch delete, which `object_store` takes but does not
# re-export. Already in the lockfile, at the version `object_store` uses.
http         = { version = "1", optional = true }

[dev-dependencies]
pstore-testkit = { path = "../pstore-testkit" }
# The M85 measurement example clusters real vectors; a dev-dependency cycle cargo allows.
pstore-index = { path = "../pstore-index" }
pstore-format = { path = "../pstore-format" }
pstore-types = { path = "../pstore-types" }
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
async-trait = "0.1"
object_store = { version = "0.14.1", default-features = false }
# M107: the emulator test seeds objects with a request `object_store` cannot send there.
http = "1"

[features]
object_store = ["dep:object_store"]
# M107: GCS's batch delete, one request for up to 100 objects. Not in `pstore-server`'s
# features: GCS is not a server backend (the capability matrix), only a probe target.
gcs = ["object_store", "object_store/gcp", "dep:http"]
# ⚠️ The emulator-integration feature `dev/README.md` has always named and nothing has ever
# provided. It pulls the three cloud clients in; `scripts/conformance.sh` is what runs them.
compat = [
    "object_store",
    "object_store/aws",
    "gcs",
    "object_store/azure",
]

[[example]]
name = "probe"
required-features = ["compat"]

[[example]]
name = "coalesce_s3"
required-features = ["compat"]
