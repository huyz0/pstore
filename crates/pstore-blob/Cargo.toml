[package]
name        = "pstore-blob"
version     = "0.1.0"
description = "The only way pstore touches durable storage: BlobStore trait, backends, accounting, coalescing."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-types = { path = "../pstore-types" }
async-trait  = "0.1"
bytes        = "1"
thiserror    = "2"
tokio        = { version = "1", features = ["sync", "time", "rt"] }

[dev-dependencies]
pstore-types = { path = "../pstore-types" }
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
