[package]
name        = "pstore-query"
version     = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true

[lints]
workspace = true

[dependencies]
bytes         = "1"
futures-util  = { version = "0.3", default-features = false, features = ["std", "alloc"] }
pstore-blob   = { path = "../pstore-blob" }
pstore-format = { path = "../pstore-format" }
pstore-index  = { path = "../pstore-index" }
thiserror     = "2"
# M15: Regex, and Glob compiled to it.
regex         = { version = "1", default-features = false, features = ["std", "unicode"] }
# M15.2: the parsed pattern, for the literals every match must contain.
regex-syntax  = { version = "0.8", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
bytes          = "1"
pstore-testkit = { path = "../pstore-testkit" }
pstore-types   = { path = "../pstore-types" }
tokio          = { version = "1", features = ["macros", "rt-multi-thread"] }
