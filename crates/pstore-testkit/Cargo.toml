[package]
name        = "pstore-testkit"
version     = "0.1.0"
description = "Conformance probes and sensitivity sweeps. Never shipped: dev-dependencies only."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
bytes        = "1"
tokio        = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
