[package]
name        = "pstore-testkit"
version     = "0.1.0"
description = "Conformance probes and sensitivity sweeps. Never shipped: dev-dependencies only."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# ⚠️ Test infrastructure: never linked into anything that runs, so it is outside the coverage
# floor. `scripts/coverage.sh` reads this key rather than inferring shipping from the
# dependency graph — inference put `pstore-engine`, the correctness core, outside the gate.
[package.metadata.pstore]
ships = false

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
bytes        = "1"
tokio        = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1.92"
thiserror    = "2"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
