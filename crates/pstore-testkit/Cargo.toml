[package]
name        = "pstore-testkit"
version     = "0.1.0"
description = "Conformance probes and sensitivity sweeps. Never shipped: dev-dependencies only."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# ⚠️ Test infrastructure: never linked into anything that runs, so it is outside the coverage
# floor. `scripts/coverage.sh` reads this key rather than inferring shipping from the
# dependency graph — inference put `pstore-engine`, the correctness core, outside the gate.
[package.metadata.pstore]
ships = false

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
bytes        = "1"
tokio        = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1.92"
thiserror    = "2"
# M286: the fake S3 both clients are tested and benchmarked against.
hyper          = { version = "1", default-features = false, features = ["server", "http1"], optional = true }
hyper-util     = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http           = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
md-5           = { version = "0.11", optional = true }
# M279: the race probes start their writers at once, in one task.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[features]
s3 = ["pstore-blob/s3-native", "dep:hyper", "dep:hyper-util", "dep:http", "dep:http-body-util", "dep:md-5", "tokio/net"]
# M288: the fake Azure Blob service, which verifies with pstore's own SharedKey signer.
azure = ["s3", "pstore-blob/azure-native"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
