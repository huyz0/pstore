[package]
name        = "pstore-format"
version     = "0.1.0"
description = "The immutable segment: data blocks, index section, and a footer one suffix GET can bootstrap."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
async-trait  = "0.1"
bytes        = "1"
thiserror    = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
