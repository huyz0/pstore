[package]
name        = "pstore-node"
version     = "0.1.0"
description = "A cluster member: joins from the roster, gossips, reports what it would own."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob    = { path = "../pstore-blob", features = ["object_store"] }
pstore-cluster = { path = "../pstore-cluster" }
pstore-gossip  = { path = "../pstore-gossip" }
pstore-types   = { path = "../pstore-types" }
bytes          = "1"
chitchat       = "0.13"
anyhow         = "1"
async-trait    = "0.1"
object_store   = { version = "0.14.1", features = ["aws"] }
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }

[dev-dependencies]
pstore-testkit = { path = "../pstore-testkit" }
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
