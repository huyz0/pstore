[package]
name        = "pstore-server"
version     = "0.1.0"
description = "The HTTP surface: the index is the noun, every response is honest about what it cost and how fresh it is."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob   = { path = "../pstore-blob", features = ["object_store"] }
pstore-engine = { path = "../pstore-engine" }
pstore-cache  = { path = "../pstore-cache" }
pstore-format = { path = "../pstore-format" }
pstore-index  = { path = "../pstore-index" }
pstore-query  = { path = "../pstore-query" }
pstore-types  = { path = "../pstore-types" }
pstore-jobs   = { path = "../pstore-jobs" }
# M56: a server's own SWIM member, and the gossip key read as pstore-node reads it.
pstore-node   = { path = "../pstore-node" }
# ⚠️ `axum` lives here and nowhere else, by the same argument that confines `object_store`
# to `pstore-blob`: a transport in a library crate is a transport every crate above it
# inherits, and the engine must stay callable without one.
axum          = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
# ⚠️ `aws` and `azure` (M46), never `gcp`: the GCS client is one the capability matrix says
# must never be a CAS target. Not `pstore-blob`'s `compat` feature, which pulls all three for
# a probe example. Azure is here because M45 took the segment open off the suffix read C-14
# found absent there.
object_store  = { version = "0.14.1", features = ["aws", "azure"] }
# D-36: a vector may arrive as base64 of little-endian `f32`s (M9d). Already in the lockfile.
base64        = "0.22"
# M9g: a multi-query's sub-queries run concurrently.
futures-util  = { version = "0.3", default-features = false, features = ["std", "alloc"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
# M20: the store id is 128 random bits. Already in the lockfile.
getrandom     = "0.3"
# M127: standard bearer validation; reuse the existing AWS-LC provider, without PEM.
jsonwebtoken  = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
# Peer MessagePack over mTLS HTTP/2 (TCP) and HTTP/3 (QUIC).
rmp-serde     = "1.3"
bytes         = "1"
http-body-util = "0.1"
hyper         = { version = "1", default-features = false, features = ["client", "server", "http2"] }
hyper-util    = { version = "0.1", default-features = false, features = ["tokio"] }
h3            = "0.0.8"
h3-quinn      = "0.0.10"
quinn         = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls        = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls  = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }

[dev-dependencies]
pstore-testkit = { path = "../pstore-testkit" }
tower         = { version = "0.5", features = ["util"] }
tokio         = { version = "1", features = ["io-util", "test-util"] }
async-trait   = "0.1"
# Generates independent trusted/untrusted/expired peer certificates in tests only.
rcgen         = { version = "0.14.7", default-features = false, features = ["aws_lc_rs", "pem"] }
# Measurement-only integration binary; ordinary tests do not run its ignored campaign.
stats_alloc   = "0.1.10"
# M15: the regex oracle a pattern filter is checked against.
regex         = { version = "1", default-features = false, features = ["std", "unicode"] }
