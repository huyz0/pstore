[package]
name        = "pstore-jobs"
version     = "0.1.0"
description = "A sharded register of runnable work over any blob store: create-once shard count, CAS'd shards, advisory claims, and reconcile against the state that owns the truth. No LIST, no broker."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
bytes        = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tokio        = { version = "1", features = ["time"] }

[dev-dependencies]
async-trait  = "0.1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
