[package]
name        = "pstore-engine"
version     = "0.1.0"
description = "HEAD and the CAS commit protocol, WAL lanes carrying cross-index bundles, and the memtable that makes a write visible before it is folded."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob   = { path = "../pstore-blob" }
pstore-format = { path = "../pstore-format" }
# ⚠️ The engine is the composition point, so it sits ABOVE the index and the query path rather
# than beside them. `pstore-index` used to dev-depend on `pstore-engine` for one test; that
# test asserts an engine property and moved with this dependency (M5g).
pstore-index  = { path = "../pstore-index" }
pstore-query  = { path = "../pstore-query" }
# `Split` implements `BlobStore`, which is an `async_trait`.
async-trait   = "0.1.92"
pstore-types  = { path = "../pstore-types" }
bytes         = "1"
thiserror     = "2"
tokio         = { version = "1", features = ["sync", "rt", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
pstore-testkit = { path = "../pstore-testkit" }
# A test that has to be a correct store until a point, and a contending one after it, has to
# implement `BlobStore` itself -- `Flaky::always_contended` refuses the setup too.
async-trait    = "0.1.92"
tokio          = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util   = { version = "0.3", default-features = false, features = ["std", "alloc"] }
