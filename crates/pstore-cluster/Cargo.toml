[package]
name        = "pstore-cluster"
version     = "0.1.0"
description = "Roster, placement, and overload skipping. Nodes own nothing."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
bytes        = "1"
thiserror    = "2"

[dev-dependencies]
pstore-testkit = { path = "../pstore-testkit" }
tokio          = { version = "1", features = ["macros", "rt-multi-thread"] }
