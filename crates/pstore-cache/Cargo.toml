[package]
name        = "pstore-cache"
version     = "0.1.0"
description = "A read cache keyed by requested range. Outermost decorator; never caches a mutable object."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
pstore-blob  = { path = "../pstore-blob" }
pstore-types = { path = "../pstore-types" }
bytes       = "1"
async-trait = "0.1"
tokio       = { version = "1", features = ["sync"] }

[dev-dependencies]
pstore-testkit = { path = "../pstore-testkit" }
pstore-format   = { path = "../pstore-format" }
async-trait     = "0.1"
tokio          = { version = "1", features = ["macros", "rt-multi-thread"] }
