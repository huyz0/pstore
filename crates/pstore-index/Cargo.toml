[package]
name        = "pstore-index"
version     = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true

[lints]
workspace = true

[dependencies]
pstore-blob   = { path = "../pstore-blob" }
pstore-format = { path = "../pstore-format" }

[dev-dependencies]
bytes          = "1"
pstore-testkit = { path = "../pstore-testkit" }
pstore-types   = { path = "../pstore-types" }
tokio          = { version = "1", features = ["macros", "rt-multi-thread"] }
