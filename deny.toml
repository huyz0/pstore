# cargo-deny: advisories, licences, and dependency bans.
[advisories]
yanked = "deny"
# ⚠️ **Ignored by the owner's decision (2026-10-20), not because it was fixed.** `paste` is
# unmaintained (RUSTSEC-2024-0436): an advisory with no vulnerability and no safe version to
# move to. It is a compile-time proc-macro that only `foyer-memory` pulls in, under
# `pstore-cache`, so no `paste` code runs in a node. Remove this entry once foyer drops it --
# `cargo deny` warns about an ignore that matches nothing, so the gate will say when.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; compile-time only, via foyer-memory; owner accepted 2026-10-20" },
    # zstd 0.13: foyer 0.22.3 and chitchat 0.13 pin it, and the fixes are in zstd 0.14.3 and
    # zstd-safe 8.2, which neither can take. None of the four vulnerable paths is called: foyer
    # uses `stream::write::Encoder::new` and `read::Decoder`, chitchat and `pstore-format` the
    # bulk API and `read::Decoder`. Remove these once both move to zstd 0.14 -- the gate warns
    # about an ignore that matches nothing.
    { id = "RUSTSEC-2026-0391", reason = "zstd with_context stream reuse; no caller uses with_context; pinned by foyer 0.22.3 and chitchat 0.13; owner accepted 2026-10-26" },
    { id = "RUSTSEC-2026-0398", reason = "zstd seekable decompress; the seekable feature is not enabled; pinned by foyer 0.22.3 and chitchat 0.13; owner accepted 2026-10-26" },
    { id = "RUSTSEC-2026-0403", reason = "zstd legacy-frame decompress_stream into a Vec; no caller decodes a stream into a Vec; pinned by foyer 0.22.3 and chitchat 0.13; owner accepted 2026-10-26" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys allocator shim on wasm32 only; pstore ships no wasm32 target; pinned by foyer 0.22.3 and chitchat 0.13; owner accepted 2026-10-26" },
]

[licenses]
# ⚠️ An allowance no crate uses is a FAILURE here, not a spare permission — `cargo deny`
# reports it as "unmatched license allowance", and a list that accumulates unused entries
# stops saying anything about what the tree actually depends on. `BSD-2-Clause` was removed
# for exactly that reason; if a dependency ever needs it, the gate will say so and it goes
# back with the crate that justified it named alongside.
# `CDLA-Permissive-2.0` is here for exactly one crate: `webpki-root-certs`, the Mozilla CA
# root bundle that `object_store`'s S3 client needs to speak TLS to a real cloud. It is a
# permissive DATA licence with no copyleft and no attribution burden on a binary, and it
# arrived with M4b's node — the first thing in this tree to open an outbound connection.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
# Enforces D-2 at the dependency level: only pstore-blob may depend on
# object_store. Everything above it goes through the BlobStore trait so that
# request accounting and congestion control are unavoidable.
# ⚠️ `pstore-node` is the process that must name a real backend — it is a binary, and
# something has to construct one. It may only CONSTRUCT: everything it does afterwards goes
# through `BlobStore`, so the ban still holds where it matters, and this list is the audit.
# ⚠️ `axum` is confined the same way, and until M7g that confinement was a COMMENT in
# `crates/pstore-server/Cargo.toml` -- which is not a gate. A transport in a library crate is
# a transport every crate above it inherits, and the engine must stay callable without one.
deny = [
    { name = "object_store", wrappers = ["pstore-blob", "pstore-node", "pstore-server"] },
    { name = "axum", wrappers = ["pstore-server"] },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
