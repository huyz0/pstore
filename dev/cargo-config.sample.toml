# Copy to .cargo/config.toml. Build memory, not build speed, is what kills
# WSL2 -- linking is the peak. See The Rust Performance Book, "Build Configuration".
[build]
jobs = 6                                  # cap below core count; more jobs = more peak RAM

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]   # mold links fast and uses less memory than lld

[profile.dev]
debug = 1                                 # full debug info is a large memory contributor
# ⚠️ No `split-debuginfo` here: rustc refuses `unpacked` on Windows MSVC ("unstable on this
# platform"), so setting it in a profile failed every cargo command there. It is a Linux
# link-memory saving, so it is set where Linux builds happen -- the dev image's
# `CARGO_PROFILE_DEV_SPLIT_DEBUGINFO`, which a `RUSTFLAGS` cannot hide, and the target table
# below for a bare Linux host. macOS already defaults to `unpacked`.

[profile.test]
debug = 1

# Release-ish profile for local benchmarking. NOTE: numbers measured under WSL2
# are RELATIVE only (did this change help?), never absolute -- see D-104.
[profile.bench]
inherits = "release"
debug = 1
codegen-units = 1                         # slower build, faster code, lower LLVM parallel RAM

# ⚠️ Ignored whenever `RUSTFLAGS` is set (CI; `mutants.sh` with mold) -- which is why the dev
# image sets the profile variable instead, and this only covers a bare Linux host.
[target.'cfg(target_os = "linux")']
rustflags = ["-Csplit-debuginfo=unpacked"]
