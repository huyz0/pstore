# Local dev/test stack for pstore on WSL2.
#   docker compose -f dev/docker-compose.yml up -d
# Every service is resource-capped so a runaway test kills one container,
# not the WSL2 VM. See docs/research/09-rust-stack/dev-and-test-environment.md
name: pstore-dev

x-caps: &caps
  deploy:
    resources:
      limits: { cpus: '1', memory: 1G }

services:
  # ---- S3-compatible. RustFS replaced MinIO in M8a, and measured identically: CAS and
  # create-if-absent Supported, ABA Divergent (MD5 ETags repeat). The conformance suite
  # records it in docs/profiles/capability-matrix.md; do not assume CAS parity with S3.
  rustfs:
    image: rustfs/rustfs:1.0.0   # pin: CAS behaviour varies, and `conformance.sh --check` notices
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: pstore
      RUSTFS_SECRET_KEY: pstore-dev-secret
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      retries: 12
    <<: *caps

  # ---- Azure Blob. Pin the version: If-Match:"*" on a missing blob
  # returned the wrong status in older releases (Azure/Azurite#2589).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]
    <<: *caps

  # ---- GCS. Generation preconditions are our cleanest CAS story on paper;
  # OQ-153 asks whether this emulator is actually faithful to them.
  gcs:
    image: fsouza/fake-gcs-server:1.55
    command: -scheme http -host 0.0.0.0 -port 4443 -public-host localhost:4443
    ports: ["4443:4443"]
    <<: *caps

  # ---- Build/test container. Cargo target lives in a NAMED VOLUME, never a
  # bind mount: 9p cross-filesystem IO on WSL2 is an order of magnitude slower.
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /work
    # ⚠️ An init process as PID 1, to reap orphans. Without it the command IS PID 1, and a
    # mutation sweep's PID 1 is cargo-mutants, which never waits on children it did not spawn:
    # every orphaned build or test process became a zombie. Measured: 30,627 zombies after
    # ~20 hours, which exhausted the Docker VM kernel's PID space -- so every fork in EVERY
    # container failed with EAGAIN, cargo-mutants recorded those failed builds as "unviable"
    # mutants, and both running sweeps then hung at 0% CPU.
    init: true
    volumes:
      - ../:/work:cached
      - cargo-target:/work/target
      - cargo-registry:/usr/local/cargo/registry
      - sccache:/sccache
    environment:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /sccache
      CARGO_BUILD_JOBS: "6"
      PSTORE_S3_ENDPOINT: http://rustfs:9000
      PSTORE_AZURE_ENDPOINT: http://azurite:10000
      PSTORE_GCS_ENDPOINT: http://gcs:4443
    depends_on: [rustfs, azurite, gcs]
    deploy:
      resources:
        # ⚠️ Still well under the WSL2 VM ceiling (32 GB in dev/wslconfig.sample), so a bad
        # build OOMs this container only -- which is the whole point of the nesting.
        #
        # Raised from 6 CPUs / 8 GB because a mutation sweep is the heaviest thing here and
        # 8 GB derives only 2 concurrent jobs, which put a full sweep at 87 minutes.
        # `scripts/mutants.sh` sizes its jobs from `/sys/fs/cgroup/memory.max`, so this
        # number is the knob: 16 GB gives 4 jobs.
        limits: { cpus: '10', memory: 16G }
    command: sleep infinity

volumes:
  cargo-target:
  cargo-registry:
  sccache:
