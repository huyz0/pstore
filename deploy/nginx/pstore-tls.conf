# Public HTTPS in front of pstore-server (M237): the reverse proxy docs/deploy.md's `tls`
# section asks for. `scripts/tls-smoke.sh` runs this file as written, filling in only the
# at-sign placeholders, so what the smoke test proves is what this file configures.
#
# The proxy terminates TLS and forwards. It is not an identity: pstore takes the tenant
# from the signed bearer token (M127), passes the Authorization header through untouched,
# and refuses a tenant header that disagrees with it. Keep pstore bound to loopback or a
# private address, so this listener is its only public path.

worker_processes 1;
pid @RUN@/nginx.pid;
error_log @RUN@/error.log warn;

events {
    worker_connections 64;
}

http {
    access_log @RUN@/access.log;
    client_body_temp_path @RUN@/body;
    proxy_temp_path @RUN@/proxy;
    fastcgi_temp_path @RUN@/fastcgi;
    uwsgi_temp_path @RUN@/uwsgi;
    scgi_temp_path @RUN@/scgi;
    server_tokens off;

    upstream pstore {
        server @UPSTREAM@;
        keepalive 16;
    }

    server {
        listen @LISTEN@ ssl;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;

        # ⚠️ pstore refuses some requests before it reads their body (a bad credential, an
        # admission limit, an oversized Content-Length: M128), then closes. A proxy still
        # sending that body gets a reset and answers 502 instead of pstore's refusal (M237
        # measured it from 1 MiB streamed). So the proxy buffers the whole body first, and
        # bounds it at pstore's own `body_bytes` (2 MiB by default; keep the two equal),
        # answering an oversized body itself with pstore's own typed refusal, byte for byte.
        # Buffering makes the reset rarer, not impossible: run pstore with
        # `drain_refused_bodies` (M238) as well, and it reads a refused body to its end.
        client_max_body_size 2m;
        proxy_request_buffering on;
        error_page 413 @too_large;

        location @too_large {
            default_type application/json;
            return 413 '{"error":{"code":"request_too_large","message":"the request body is larger than this server admits","retryable":false}}';
        }

        location / {
            proxy_pass http://pstore;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
