# CI runs in an already-containerized environment, so nothing here re-containerizes.
# The same commands run locally via `docker compose run dev <cmd>` -- see dev/README.md.
# Gates and rationale: docs/research/09-rust-stack/engineering-standards.md
name: ci
on:
  push:
  pull_request:
  # ⚠️ The full mutation sweep, nightly. `--in-diff` on a PR cannot see a commit that only
  # changed test code, because the diff is matched against the code under test.
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
      # Licences, advisories, and the object_store ban that keeps request
      # accounting unavoidable above pstore-blob.
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env: { MINIO_ROOT_USER: pstore, MINIO_ROOT_PASSWORD: pstore-dev-secret }
        ports: ["9000:9000"]
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.34.0
        ports: ["10000:10000"]
      gcs:
        image: fsouza/fake-gcs-server:1.52
        ports: ["4443:4443"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Workspace floor is 95% (D-110). Per-crate targets are higher for the
      # correctness core and are checked in the nightly job.
      - run: cargo llvm-cov --all-features --workspace --fail-under-lines 95 --lcov --output-path lcov.info
      # The REGION floor, on the crates that ship. `pstore-testkit` is dev-only, so it is
      # excluded -- derived from the dependency graph rather than named here, so a future
      # test-only crate is excluded automatically and a crate that starts shipping is
      # included the moment something depends on it at runtime.
      - run: ./scripts/coverage.sh --fail-under-regions 95

  # Recall is a gate, not a periodic study (D-35): a PR that silently drops recall@10 or
  # adds a round trip must fail the build. Release mode and its own job, because a
  # gate-scale corpus does not belong in the unit suite.
  recall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/recall.sh
      - run: ./scripts/ndcg.sh
      # The depth and byte gates at the scale their criteria are stated at. In this job and
      # not the unit suite, because `cargo mutants` reruns the suite once per mutant and the
      # 20,000-document fixture cost 36 seconds each time -- four and a half hours across a
      # sweep.
      - run: ./scripts/depth.sh

  # Coverage says a line ran; mutation says a test would have noticed if it changed.
  # Only the second one makes 95% mean something (D-111).
  #
  # ⚠️ Two jobs, because `--in-diff` and a full sweep answer different questions. The diff is
  # matched against the code UNDER TEST, so a commit that changes only *test* code produces
  # no mutants and passes in seconds while having materially changed the suite's strength.
  # That is what the nightly sweep is for.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - run: ./scripts/mutants.sh
        if: github.event_name == 'pull_request'

  # The full sweep, sharded. Shards need no runtime coordination -- each one discovers every
  # mutant and selects its own subset -- so this is a matrix and nothing else.
  mutants-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      # ⚠️ Every shard must be run with the same denominator or the results are meaningless:
      # they do not compare notes, they each filter the same enumeration.
      - run: ./scripts/mutants.sh --shard ${{ matrix.shard }}/8

  # unsafe lives in exactly one crate (D-109). This job is the audit trail:
  # `unsafe_code = "forbid"` at the workspace root makes a stray unsafe block a
  # compile error, and miri checks the one crate that is allowed to have them.
  unsafe-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
      - name: Only pstore-kernel may relax the unsafe_code lint
        run: |
          offenders=$(grep -rlE '^\s*unsafe_code\s*=\s*"(allow|warn)"' --include=Cargo.toml . \
                      | grep -v 'crates/pstore-kernel/' || true)
          if [ -n "$offenders" ]; then echo "unsafe relaxed outside pstore-kernel:"; echo "$offenders"; exit 1; fi
      - run: cargo miri test -p pstore-kernel
        if: hashFiles('crates/pstore-kernel/Cargo.toml') != ''

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rungs 3 and 5 of the gate-design ladder: predicates over files in the tree,
      # so no agent is asked to check them.
      - run: ./scripts/check-dev-env.sh
      - run: ./scripts/check-poison.sh
      - run: ./scripts/check-links.sh
      - run: ./scripts/build-index.py --check
      # The round counter is the mechanism that bounds review, so it is tested --
      # in the project this was distilled from, a silently-broken counter meant the
      # cap never fired and one task reached eleven rounds.
      - run: ./scripts/selftest-review.sh
      # OQ-167: every acceptance criterion has an evidence line, and every test it
      # names resolves. Spec drift is the one problem no SDD framework solves; this
      # is the only part of it a predicate can catch.
      - run: ./scripts/check-verified.py
      - run: ./scripts/selftest-check-verified.sh
      - run: ./scripts/check-slos.py
      - run: ./scripts/selftest-check-slos.sh
      - run: ./scripts/check-poison.sh --selftest
